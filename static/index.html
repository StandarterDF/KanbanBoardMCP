<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board MCP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=20261031-5">
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <div class="brand">Kanban</div>
    <div class="project-switcher">
      <select id="projectSelect"></select>
      <button id="btnNewProject" class="icon-btn" title="Новый проект">+</button>
      <button id="btnRenameProject" class="icon-btn" title="Переименовать">✎</button>
      <button id="btnDeleteProject" class="icon-btn" title="Удалить">🗑</button>
    </div>
  </div>
  <div class="topbar-search">
    <input id="searchInput" type="text" placeholder="Поиск по названию / описанию..." />
  </div>
  <div class="topbar-filters">
    <div class="ms" id="catFilter">
      <button class="ms-btn" type="button">Категории ▾</button>
      <div class="ms-panel"></div>
    </div>
    <div class="ms" id="prioFilter">
      <button class="ms-btn" type="button">Приоритеты ▾</button>
      <div class="ms-panel"></div>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btnNewTask" class="btn btn-primary">+ Задача</button>
    <button id="btnAnalyze" class="btn btn-ghost">Анализ</button>
    <button id="btnSettings" class="btn btn-ghost">⚙</button>
  </div>
</header>

<div class="boards-bar" id="boardsBar">
  <div class="board-tabs" id="boardTabs"></div>
  <button id="btnNewBoard" class="btn btn-ghost boards-add" type="button">+ Доска</button>
</div>

<main class="board" id="board"></main>

<!-- Task Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal modal-task" id="taskModalDialog">
    <div class="modal-header">
      <h2 id="modalTitle">Задача</h2>
      <div class="modal-header-actions">
        <button class="icon-btn" id="btnFullscreen" title="Развернуть на весь экран">⛶</button>
        <button class="icon-btn" id="modalClose">✕</button>
      </div>
    </div>
    <div class="modal-body task-layout">
      <input type="hidden" id="taskId" />
      <div class="task-main">
        <input type="text" id="taskTitle" class="task-title-input" placeholder="Название задачи" />

        <div class="modal-tabs">
          <button class="modal-tab active" id="btnTabDesc" type="button">Описание</button>
          <button class="modal-tab" id="btnTabHistory" type="button">История</button>
        </div>

        <div class="task-pane" id="taskDescPane">
          <div class="desc-toolbar">
            <button class="tab active" id="btnEditDesc" type="button">Редактировать</button>
            <button class="tab" id="btnPreviewDesc" type="button">Предпросмотр</button>
          </div>
          <textarea id="taskDesc" rows="8" placeholder="Описание / критерии приёмки (Markdown)"></textarea>
          <div id="taskDescPreview" class="markdown-body" style="display:none"></div>
          <div class="comments-section" id="commentsSection" style="display:none">
            <h3>Комментарии</h3>
            <div class="comments-list" id="commentsList"></div>
            <div class="comment-form">
              <input type="text" id="commentText" placeholder="Написать комментарий...">
              <button class="btn btn-primary" id="btnAddComment">Отправить</button>
            </div>
          </div>
        </div>

        <div class="task-pane" id="taskHistoryPane" style="display:none">
          <div class="history-timeline" id="historyList"></div>
        </div>
      </div>
      <aside class="task-sidebar">
        <div class="side-card">
          <label>Статус</label>
          <div class="status-list" id="statusList"></div>
        </div>
        <div class="side-card">
          <label>Приоритет</label>
          <select id="taskPriority">
            <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
          </select>
        </div>
        <div class="side-card">
          <label>Категория</label>
          <select id="taskCategory"></select>
        </div>
        <div class="side-card">
          <label>Доска</label>
          <select id="taskBoard"></select>
        </div>
        <div class="side-card">
          <label>Agent ID</label>
          <input type="text" id="taskAgent" placeholder="—" />
        </div>
        <div class="side-card">
          <label>Затронутые файлы</label>
          <textarea id="taskAffectedFiles" rows="4" placeholder="path/to/file.py, ..."></textarea>
        </div>
        <div class="side-card meta-card">
          <label>ID задачи</label>
          <div class="id-row">
            <input type="text" id="taskPublicId" readonly placeholder="появится после сохранения" />
            <button class="btn btn-ghost btn-copy-id" id="btnCopyTaskId" type="button" disabled>Копировать ID</button>
          </div>
          <label>Создано</label>
          <div class="time-value" id="taskCreated">—</div>
          <label>Обновлено</label>
          <div class="time-value" id="taskUpdated">—</div>
          <label>Последнее перемещение</label>
          <div class="time-value" id="taskLastMove">—</div>
        </div>
      </aside>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btnDeleteTask" type="button">Удалить</button>
      <span id="saveStatus" class="save-status" aria-live="polite"></span>
      <button class="btn btn-primary" id="btnSaveTask" type="button">Сохранить</button>
    </div>
  </div>
</div>

<!-- Column Modal -->
<div class="modal-overlay" id="columnModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2 id="columnModalTitle">Колонка</h2>
      <button class="icon-btn" id="columnModalClose">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="columnId">
      <label>Название
        <input type="text" id="columnName" placeholder="Название колонки">
      </label>
      <label>Цвет
        <input type="color" id="columnColor" value="#4a90d9">
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btnDeleteColumn">Удалить</button>
      <button class="btn btn-primary" id="btnSaveColumn">Сохранить</button>
    </div>
  </div>
</div>

<!-- Settings Drawer -->
<div class="drawer-overlay" id="settingsOverlay"></div>
<aside class="drawer" id="settingsDrawer">
  <div class="drawer-header">
    <h2>Настройки MCP</h2>
    <button class="icon-btn" id="settingsClose">✕</button>
  </div>
  <div class="drawer-body" id="settingsBody"></div>
</aside>

<script src="/static/app.js?v=20261031-5"></script>
</body>
</html>
